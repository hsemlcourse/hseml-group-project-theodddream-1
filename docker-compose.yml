services:
  app:
    build: .
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: pytest -q tests/

  lint:
    build: .
    command: ruff check src/ --line-length 120

  jupyter:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./notebooks:/app/notebooks
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
